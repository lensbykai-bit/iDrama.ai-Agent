</style></head><body><div id="root"></div><script>
'use strict';
const KEY='idrama-agent-demo-v1',SITE='https://lensbykai-bit.github.io/iDrama.ai/?ref=AG001';
const sample={name:'Agent iDrama',email:'agent@example.com',id:'AG001',success:410,clicks:1240,registrations:410};
let user=null,view='register',tab='home';try{const data=JSON.parse(localStorage.getItem(KEY)||'null');if(data&&data.email){user={...sample,name:data.name,email:data.email};view='app'}}catch{}
const h=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const dollars=(sample.success*25/1000).toFixed(2);
const root=document.querySelector('#root');
function header(label='Agent Dashboard'){return '<div class="heading"><div class="brand"><span class="logo">▶</span><span>iDrama.ai <span class="pink">Agent</span><div class="subtitle">'+label+'</div></span></div><span class="pill">DEMO</span></div>'}
function stats(){return '<div class="stats"><div class="stat"><span>👥</span><div class="small">ភ្ញៀវជោគជ័យ</div><strong>410</strong></div><div class="stat"><span>💰</span><div class="small">កម្រៃក្នុងម្នាក់</div><strong>$0.025</strong></div><div class="stat"><span>💳</span><div class="small">កម្រៃសរុប</div><strong class="money">$'+dollars+'</strong></div></div>'}
function tabs(){return '<nav class="nav">'+[['home','⌂','ដើម'],['ref','⇧','ណែនាំ'],['wallet','▣','Wallet'],['profile','♙','គណនី']].map(([id,i,label])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+i+'<br>'+label+'</button>').join('')+'</nav>'}
function home(){return header()+'<div class="card hero"><div class="small">សួស្តី, '+h(user.name)+' 👋</div><h1 class="money">$'+dollars+'</h1><div class="small">ប្រាក់កម្រៃជើងសារសរុប (គំរូ)</div></div>'+stats()+'<div class="card" style="margin-top:14px"><h2>🔗 លីងណែនាំភ្ញៀវ</h2><div class="link">'+SITE+'</div><button class="btn" data-copy>ចម្លងលីងគំរូ</button></div><div class="card"><h2>📅 ដកប្រាក់ប្រចាំខែ</h2><p class="small">បើកស្នើដកប្រាក់ថ្ងៃទី៥ រៀងរាល់ខែ បន្ទាប់ពីអនុម័តដោយ Admin។</p></div>'}
function referral(){return header('Referral')+'<div class="card"><h2>លីងណែនាំភ្ញៀវ</h2><p class="small">កូដភ្នាក់ងារ៖ AG001 (គំរូ)</p><div class="link">'+SITE+'</div><div class="actions"><button class="btn" data-copy>ចម្លងលីង</button><button class="btn secondary" data-share>ចែករំលែក</button></div></div><div class="card"><h2>ស្ថិតិការណែនាំ (គំរូ)</h2><div class="row"><span>ចុចលីង</span><b>1,240</b></div><div class="row"><span>ការចុះឈ្មោះ</span><b>410</b></div><div class="row"><span>ភ្ញៀវទិញជោគជ័យ</span><b>410</b></div></div>'}
function wallet(){return header('Wallet & Commission')+'<div class="card hero"><div class="small">ប្រាក់កម្រៃជើងសារសរុប (គំរូ)</div><h1 class="money">$'+dollars+'</h1><div class="small">410 × $0.025</div></div>'+stats()+'<div class="card" style="margin-top:14px"><h2>ប្រវត្តិកម្រៃ (គំរូ)</h2>'+[1,2,3].map(n=>'<div class="row"><span class="small">ការណែនាំជោគជ័យ #00'+n+'</span><b class="money">+$0.025</b></div>').join('')+'</div><div class="card"><h2>📅 ស្នើដកប្រាក់ថ្ងៃទី៥</h2><p class="small">មុខងារដកប្រាក់មិនទាន់ភ្ជាប់ទេ។</p><button class="btn" disabled>ដកប្រាក់ (មិនទាន់បើក)</button></div>'}
function profile(){return header('Profile')+'<div class="card"><h2>ព័ត៌មានភ្នាក់ងារ</h2><div class="row"><span>ឈ្មោះ</span><b>'+h(user.name)+'</b></div><div class="row"><span>អ៊ីមែល</span><span class="small">'+h(user.email)+'</span></div><div class="row"><span>កូដ</span><b>AG001 (Demo)</b></div></div><div class="card"><h2>លក្ខខណ្ឌកម្រៃ</h2><p class="small">ភ្ញៀវថ្មីចុះឈ្មោះ និងទិញរឿងដោយទូទាត់ជោគជ័យ = $0.025 ម្តងក្នុងម្នាក់។</p><p class="small">ស្នើដកប្រាក់ថ្ងៃទី៥ រៀងរាល់ខែ។ ប្រាក់មិនបានដកបន្តទៅខែបន្ទាប់។</p></div><button class="btn secondary" data-logout>ចេញពីគំរូ</button>'}
function auth(){return '<section class="auth"><div class="center"><div class="logo" style="display:inline-block;font-size:28px">▶</div><h1>iDrama.ai <span class="pink">Agent</span></h1><p class="muted">'+(view==='register'?'ចុះឈ្មោះភ្នាក់ងារ':'ចូលគណនីភ្នាក់ងារ')+'</p></div><div class="card"><form id="form">'+(view==='register'?'<label class="field">ឈ្មោះភ្នាក់ងារ<input name="name" required maxlength="80" autocomplete="name"></label>':'')+'<label class="field">អ៊ីមែល<input name="email" type="email" required autocomplete="email"></label><label class="field">ពាក្យសម្ងាត់ (គំរូ)<input name="password" type="password" required minlength="8" autocomplete="'+(view==='register'?'new-password':'current-password')+'"></label><button class="btn" type="submit">'+(view==='register'?'បង្កើតគណនីសាកល្បង':'ចូលគណនីសាកល្បង')+'</button><div class="error" id="error"></div></form><button class="btn secondary" id="switch">'+(view==='register'?'មានគណនីហើយ? ចូលគណនី':'បង្កើតគណនីថ្មី')+'</button></div><div class="note">សម្រាប់បង្ហាញ UI ប៉ុណ្ណោះ។ មិនមានការផ្ទៀងផ្ទាត់ Login ពិត និងមិនរក្សាទុកពាក្យសម្ងាត់ទេ។ កុំប្រើពាក្យសម្ងាត់ពិតរបស់អ្នក។</div></section>'}
function render(){root.innerHTML='<main class="app">'+(view==='app'?({home,ref:referral,wallet,profile}[tab]()+tabs()):auth())+'</main>';bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(SITE);b.textContent='បានចម្លង ✓'}catch{window.prompt('ចម្លងលីងគំរូ',SITE)}});document.querySelector('[data-share]')?.addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:'iDrama.ai demo',url:SITE})}catch{}}else{try{await navigator.clipboard.writeText(SITE)}catch{window.prompt('ចម្លងលីងគំរូ',SITE)}}});document.querySelector('[data-logout]')?.addEventListener('click',()=>{view='login';user=null;localStorage.removeItem(KEY);render()});document.querySelector('#switch')?.addEventListener('click',()=>{view=view==='register'?'login':'register';render()});document.querySelector('#form')?.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget),email=String(d.get('email')).trim();if(view==='login'){let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!saved||saved.email!==email){document.querySelector('#error').textContent='សូមចុះឈ្មោះសាកល្បងជាមុន';return}user={...sample,name:saved.name,email}}else{user={...sample,name:String(d.get('name')).trim(),email};localStorage.setItem(KEY,JSON.stringify({name:user.name,email}))}view='app';tab='home';render()})}
render();
</script></body></html>
